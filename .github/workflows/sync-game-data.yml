name: Sync game data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-game-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync character and version data
        run: npm run data:sync

      - name: Sync main-story appearances and dialogue
        run: npm run data:sync-stories

      - name: Generate derived statistics and word clouds
        run: npm run data:generate

      - name: Validate synchronized data
        run: npm run data:validate

      - name: Audit story dialogue attribution
        run: npm run data:audit-stories

      - name: Run application quality checks
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Publish checked data
        run: |
          # Scrape timestamps alone do not require a new deployment.
          git add content data
          if git diff --cached --quiet --ignore-matching-lines='"\(generatedAt\|scrapedAt\)":'; then
            echo "No data changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: sync latest game data"
          # A non-fast-forward push fails safely if main changed during the checks.
          git push origin HEAD:main
